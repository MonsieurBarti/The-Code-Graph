[workspace]
# All publishable workspace crates are released together.
# Crates with `publish = false` (benches) are automatically skipped.
# Publish order is resolved from the dependency graph.
dependencies_update = true

# Disable per-package git tags/releases at workspace level.
# Only the main binary package creates a single v* tag (see [[package]] below).
git_tag_enable = false
git_release_enable = false

# Main binary — single version tag so release.yml (triggers on v*) fires correctly.
[[package]]
name = "the-code-graph"
git_tag_name = "v{{ version }}"
git_tag_enable = true
git_release_enable = true

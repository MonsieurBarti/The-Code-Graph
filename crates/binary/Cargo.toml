[package]
name = "the-code-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Index codebases into a queryable dependency graph"
readme = "../../README.md"
keywords = ["code-analysis", "dependency-graph", "static-analysis", "code-graph"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "tcg"
path = "src/main.rs"

[dependencies]
cli = { path = "../cli", package = "the-code-graph-cli", version = "0.1.2" }
domain = { path = "../domain", package = "the-code-graph-domain", version = "0.1.2" }
clap = { version = "4", features = ["derive"] }

[package]
name = "the-code-graph-watch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "File system watcher for The Code Graph"

[dependencies]
domain = { path = "../domain", package = "the-code-graph-domain", version = "0.1.2" }
notify = "8"
notify-debouncer-full = "0.5"
signal-hook = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

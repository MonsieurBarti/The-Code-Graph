[package]
name = "code-graph-benches"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
parser = { path = "../parser" }
storage = { path = "../storage" }
domain = { path = "../domain" }
tempfile = "3"

[[bench]]
name = "parse_throughput"
harness = false

[[bench]]
name = "query_latency"
harness = false

[[bench]]
name = "incremental_latency"
harness = false

[[bench]]
name = "impact_latency"
harness = false

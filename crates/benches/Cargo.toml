[package]
name = "code-graph-benches"
version.workspace = true
edition.workspace = true
publish = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
parser = { path = "../parser", package = "the-code-graph-parser", version = "0.1.0" }
storage = { path = "../storage", package = "the-code-graph-storage", version = "0.1.0" }
domain = { path = "../domain", package = "the-code-graph-domain", version = "0.1.0" }
tempfile = "3"

[[bench]]
name = "parse_throughput"
harness = false

[[bench]]
name = "query_latency"
harness = false

[[bench]]
name = "incremental_latency"
harness = false

[[bench]]
name = "impact_latency"
harness = false

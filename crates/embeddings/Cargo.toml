[package]
name = "the-code-graph-embeddings"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Code embedding generation for The Code Graph"

[dependencies]
domain = { path = "../domain", package = "the-code-graph-domain", version = "0.1.1" }
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
tracing = "0.1"
thiserror = "2"
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-24"
] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "the-code-graph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for The Code Graph"

[dependencies]
domain = { path = "../domain", package = "the-code-graph-domain", version = "0.1.2" }
parser = { path = "../parser", package = "the-code-graph-parser", version = "0.1.2" }
storage = { path = "../storage", package = "the-code-graph-storage", version = "0.1.2" }
watch = { path = "../watch", package = "the-code-graph-watch", version = "0.1.2" }
eval = { path = "../eval", package = "the-code-graph-eval", version = "0.1.2" }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
ignore = "0.4"
rayon = "1.10"
sha2 = "0.10"
which = "7"
embeddings = { path = "../embeddings", package = "the-code-graph-embeddings", version = "0.1.2", optional = true }
indicatif = { version = "0.18.4", optional = true }

[features]
embeddings = ["dep:embeddings", "dep:indicatif"]

[dev-dependencies]
tempfile = "3"

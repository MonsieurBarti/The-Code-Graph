[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { path = "../domain" }
parser = { path = "../parser" }
storage = { path = "../storage" }
watch = { path = "../watch" }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ignore = "0.4"
rayon = "1.10"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
